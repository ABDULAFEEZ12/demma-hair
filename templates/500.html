<!DOCTYPE html>
<html lang="en">
<head>

  </style>

  <div class="error-container">
    <div class="error-number">500</div>

    <a href="/" class="btn btn-gold" style="width:auto;display:inline-flex;padding-left:28px;padding-right:28px;"><i class="ri-arrow-left-line"></i> Return Home</a>
