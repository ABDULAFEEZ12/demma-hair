<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product · DIMMAHAIRSHOP Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="admin-container">
{% set active_page = 'add_product' %}
{% include "_admin_header.html" %}

  <div class="section">
    <h2><i class="ri-add-line" style="margin-right: 10px;"></i> Add New Product</h2>
    <form method="POST" action="{{ url_for('add_product') }}" enctype="multipart/form-data">
      {% include "_admin_product_fields.html" %}
      <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem;"><i class="ri-add-line"></i> Add Product</button>
    </form>
  </div>
</div>
</body>
</html>
