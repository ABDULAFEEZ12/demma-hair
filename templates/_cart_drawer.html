<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header"><h3>Your Bag</h3><button id="close-cart" aria-label="Close cart"><i class="ri-close-line"></i></button></div>
  <div class="cart-items" id="cartItemsContainer"><p style="text-align:center;padding:3rem;color:#999;">Your bag is empty</p></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Subtotal</span><strong id="cartTotal">₦0</strong></div>
    <p style="font-size:0.75rem;color:var(--stone);margin-bottom:1rem;">Delivery is calculated at checkout based on your location.</p>
    <button class="btn" id="checkoutBtn">CHECKOUT</button>
    <button class="btn btn-outline" id="clearCartBtn">Clear Bag</button>
  </div>
</div>
